name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # tag builds attach files to a GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Upload dist files
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*

  windows-installer:
    # Freeze both apps with PyInstaller and wrap them in an Inno Setup
    # installer: one download, no Python needed on the target machine.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build   # the release already exists when we upload to it
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Build frozen executables
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name photofx --paths . --add-data "photofx/lib/icons;photofx/lib/icons" packaging/win/entry_grid.py
          pyinstaller --noconfirm --clean --onefile --windowed --name photofx-viewer --paths . --add-data "photofx/lib/icons;photofx/lib/icons" packaging/win/entry_viewer.py

      - name: Build installer
        run: |
          $env:PHOTOFX_VERSION = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          iscc packaging\win\photofx.iss
          Get-ChildItem dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem dist\*-setup.exe) --clobber
