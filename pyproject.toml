[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "photofx"
version = "0.1.1"
description = "A lightweight photo catalog and editor: thumbnail grid plus single-photo viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]
keywords = ["photos", "photography", "catalog", "viewer", "culling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

[project.gui-scripts]
# gui-scripts: on Windows the commands run under pythonw with no console
# window, like the .pyw launchers; on Linux/MacOS they are plain scripts.
photofx = "photofx.app.main:main"
photofx-viewer = "photofx.viewer.__main__:main"

[tool.setuptools.packages.find]
include = ["photofx*"]

[tool.setuptools.package-data]
# toolbar icons shipped inside the package
"photofx.lib" = ["icons/*.png"]
